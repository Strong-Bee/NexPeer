name: nexpeer
description: "Private peer-to-peer messaging application built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_p2p_connection: ^3.0.3
  crypto: ^3.0.7
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  mobile_scanner: ^7.4.0
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  http: ^1.6.0
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
